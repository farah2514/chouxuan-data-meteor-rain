<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三页工具台</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f5f5;
        --panel: #ffffff;
        --panel-strong: #ffffff;
        --line: #d9d9d9;
        --text: #111111;
        --muted: #666666;
        --primary: #111111;
        --primary-strong: #000000;
        --accent: #f0f0f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Trebuchet MS", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif;
        color: var(--text);
        background: #f5f5f5;
      }

      .shell {
        max-width: 100vw;
        min-height: 100vh;
        padding: 10px;
        display: grid;
        grid-template-rows: auto auto 1fr;
        gap: 10px;
      }

      .topbar,
      .toolbar,
      .frame-card {
        background: var(--panel);
        border: 1px solid #d9d9d9;
        border-radius: 16px;
        box-shadow: none;
      }

      .topbar {
        padding: 12px 16px;
      }

      .topbar h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 0.02em;
      }

      .topbar p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .toolbar {
        padding: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }

      .tab-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .tab-btn {
        border: 1px solid #cfcfcf;
        background: #ffffff;
        color: #333333;
        border-radius: 999px;
        padding: 10px 18px;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        box-shadow: none;
        transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
      }

      .tab-btn:hover {
        background: #f3f3f3;
      }

      .tab-btn.active {
        background: #111111;
        color: #ffffff;
        border-color: #111111;
      }

      .toolbar-note {
        display: none;
      }

      .frame-card {
        min-height: calc(100vh - 154px);
        overflow: hidden;
      }

      iframe {
        width: 100%;
        height: calc(100vh - 158px);
        border: 0;
        display: block;
        background: var(--panel-strong);
      }

      @media (max-width: 860px) {
        .shell {
          padding: 8px;
        }

        .topbar h1 {
          font-size: 22px;
        }

        .toolbar {
          align-items: stretch;
        }

        .frame-card,
        iframe {
          min-height: calc(100vh - 210px);
          height: calc(100vh - 210px);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <section class="topbar">
        <h1>三页工具台</h1>
        <p>拼图、转 GIF、分类抽样分开用。</p>
      </section>

      <section class="toolbar">
        <div class="tab-list">
          <button class="tab-btn active" data-src="/collage/index.html?mode=png&v=20260826d">拼图</button>
          <button class="tab-btn" data-src="/collage/index.html?mode=gif&v=20260826d">转 GIF</button>
          <button class="tab-btn" data-src="/sampler/index.html">分类抽样</button>
        </div>
        <div class="toolbar-note"></div>
      </section>

      <section class="frame-card">
        <iframe id="toolFrame" src="/collage/index.html?mode=png&v=20260826d" title="综合工具内容区"></iframe>
      </section>
    </div>

    <script>
      const frame = document.getElementById("toolFrame");
      const buttons = Array.from(document.querySelectorAll(".tab-btn"));
      const tabMap = {
        collage: "/collage/index.html?mode=png",
        gif: "/collage/index.html?mode=gif",
        sampler: "/sampler/index.html",
      };

      function buildFrameSrc(targetSrc) {
        if (targetSrc !== tabMap.sampler) return targetSrc;
        const rootParams = new URLSearchParams(window.location.search);
        const frameUrl = new URL(targetSrc, window.location.origin);
        ["larkAuth", "message"].forEach((key) => {
          const value = rootParams.get(key);
          if (value) frameUrl.searchParams.set(key, value);
        });
        return frameUrl.pathname + frameUrl.search;
      }

      function activateTab(targetSrc) {
        const resolvedSrc = targetSrc || tabMap.collage;
        buttons.forEach((item) => item.classList.toggle("active", item.dataset.src === resolvedSrc));
        frame.src = buildFrameSrc(resolvedSrc);
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          activateTab(button.dataset.src);
        });
      });

      const params = new URLSearchParams(window.location.search);
      const initialTab = params.get("tab");
      activateTab(tabMap[initialTab] || tabMap.collage);
    </script>
  </body>
</html>
